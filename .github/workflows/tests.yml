name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      # --locked fails if uv.lock is out of date with pyproject.toml
      - run: uv sync --locked --all-extras
      - run: uv run pytest -q
