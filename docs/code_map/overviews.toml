[notebook]
"scripts/bandit_behavior_tutorial.ipynb" = "A teaching notebook for new lab members: from a raw pyControl file through <code>import_data</code> and <code>extract_trials</code> to rebuilding the single-session figure and the true/believed rank proportions as exercises."
"scripts/choice_logit_values.ipynb" = "The main modeling notebook: the choice logit as a source of value estimates, first on synthetic Q-learning mice (where the answer is known), then on the mice. Covers psychometrics on model values, stay/switch curves, WSLS negative controls and fitted-Q positive controls, regression extensions, the switch regression, the strategy tests and the kernel Q-learner / flat kernel."
"scripts/rank_signatures.ipynb" = "Behavioral tests of the ranked value algorithm: synthetic agents first (softmax vs toy rank agent), then the data selection (cohort 1 drifting problems ≤ 7, all of cohort 3), a baseline check, and the rank tests on the mice calibrated against fitted-agent replays."
"scripts/glm_hmm.ipynb" = "Do the mice switch between strategy states?: GLM-HMM on simulated switching and no-switching agents, then on the mice's problems, then on the mice, with model selection, state weights, occupancy, recovery and the choice kernel by state."
"scripts/session_behav_funcimg_trial_summary.ipynb" = "Audits every session folder for behavior and imaging data and summarizes the imaging sessions: trials by session/day/problem signature, single-session plots and true/believed rank proportions by imaging problem."
"scripts/full_pipelines/cohort-1-analysis.ipynb" = "Cohort 1 trial/block summaries, the problem 2 trial cap and reversals over completed trials."
"scripts/full_pipelines/cohort-1-vs-cohort-3.ipynb" = "Side-by-side comparison of cohorts 1 and 3."
"scripts/full_pipelines/cohort-3-analysis.ipynb" = "Cohort 3 behavior analysis and trial/block summaries."
"scripts/full_pipelines/cohort-analysis.ipynb" = "Runs the full open-field suite for cohorts 1–4 from a notebook."
"scripts/full_pipelines/fiber photometry behavior analysis.ipynb" = "The open-field analyses restricted to photometry sessions."
"scripts/funcimg/reward_responses.ipynb" = "Imaging: frame times, reward-aligned responses by pulse count, background and shared-signal checks, background-corrected ΔF/F, top cells, cross-validated reward cells, motion and flash checks."
"scripts/funcimg/zong2022_pipeline.ipynb" = "Reproduces the Zong et al. 2022 activity pipeline on the mini2p data (masks, ΔF/F and transients, SNR, motion/z drift, responses, responsive cells)."
"scripts/individual_analyses/MY_71_R_sessions_216-231_port_rankings.ipynb" = "One-off: MY_71_R's second- and third-best ports when each port was best, sessions 216–231."
