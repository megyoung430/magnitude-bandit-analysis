[project]
name = "magnitude-bandit-analysis"
version = "0.1.0"
description = "Analysis code for a 3x3 spatial drifting-value bandit task in mice"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.3.3",
    # pandas 3 changes json_normalize and dtype semantics that import_data relies on
    "pandas>=2.3.2,<3",
    "scipy>=1.17.0",
    "matplotlib>=3.10.6",
    "pydantic-settings>=2.11",
    "joblib>=1.5",
    "scikit-learn>=1.9.1",
    "packaging>=26.3",
]

[project.optional-dependencies]
# Libraries only the exploratory notebooks in scripts/ use.
notebooks = [
    "ipykernel>=6.30",
    "ipywidgets>=8.1",
    "statsmodels>=0.14",
    "networkx>=3.6",
]
# Paper-style RL / RNN fitting in src/agents.
paper-rl = [
    "jax>=0.4.30",
    "optax>=0.2.4",
]
# Numerical tests against the pinned upstream Haiku models in tests/reference.
reference-tests = [
    "magnitude-bandit-analysis[paper-rl]",
    "dm-haiku>=0.0.13",
    "ml-collections>=0.1.1",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "ruff>=0.13",
]

[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests import shared fixtures as `tests.<module>`
pythonpath = ["."]

[tool.ruff]
line-length = 100
extend-exclude = ["tests/reference"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
