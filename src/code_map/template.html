<title>Magnitude Bandit Code Map</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&display=swap">
<style>
/* Layout: sticky sidebar (sections → packages → files) beside one long reference column; search filters every function. */
:root{
  --bg:#f6f7f8; --panel:#ffffff; --ink:#1b2126; --muted:#5d6872; --line:#dde2e6;
  --accent:#0072B2; --accent-soft:#e3f0f8; --sig:#f0f3f5; --flag:#a85f00; --flag-soft:#fbf0de;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-head:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12171b; --panel:#1a2026; --ink:#e3e8ec; --muted:#97a3ad; --line:#2c353d;
  --accent:#56B4E9; --accent-soft:#1c3443; --sig:#212a31; --flag:#E69F00; --flag-soft:#3a2d14; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12171b; --panel:#1a2026; --ink:#e3e8ec; --muted:#97a3ad; --line:#2c353d;
  --accent:#56B4E9; --accent-soft:#1c3443; --sig:#212a31; --flag:#E69F00; --flag-soft:#3a2d14; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--f-body);margin:0}
code,.mono{font-family:var(--f-mono);font-size:.88em}
a{color:var(--accent);text-decoration:none} a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{display:grid;grid-template-columns:290px minmax(0,1fr);gap:28px;max-width:1380px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 64px}
nav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);align-self:start;max-height:calc(100vh - 24px);overflow:auto;
  font-size:13.5px;padding-right:6px}
nav h2{font:600 11px/1 var(--f-head);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}
nav details{margin:2px 0} nav summary{cursor:pointer;padding:3px 0;font-weight:500;list-style-position:outside}
nav ul{list-style:none;margin:2px 0 6px 0;padding-left:12px;border-left:1px solid var(--line)}
nav li a{display:block;padding:2px 0 2px 6px;color:var(--ink);font-family:var(--f-mono);font-size:12px;overflow-wrap:anywhere}
nav li a:hover{color:var(--accent)}
nav .count{color:var(--muted);font-weight:400;font-size:12px}
main{min-width:0}
header.top h1{font:600 30px/1.15 var(--f-head);margin:0 0 6px;text-wrap:balance}
header.top .lede{color:var(--muted);max-width:72ch;margin:0 0 14px}
.meta{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--muted);font-size:13px;margin-bottom:18px}
.meta b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.search{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 0;margin-bottom:6px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.search input{width:100%;font:15px var(--f-body);padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink)}
.search .hint{font-size:12.5px;color:var(--muted);margin-top:6px}
#results{display:none;background:var(--panel);border:1px solid var(--line);border-radius:6px;margin-bottom:24px}
#results.on{display:block}
#results .r{padding:8px 14px;border-top:1px solid var(--line)} #results .r:first-child{border-top:0}
#results .r .q{font-family:var(--f-mono);font-size:13px} #results .r .w{color:var(--muted);font-size:12px;font-family:var(--f-mono)}
#results .r .t{font-size:13.5px;margin-top:2px}
#results .more{padding:8px 14px;color:var(--muted);font-size:13px}
section.block{margin:34px 0 0}
section.block>h2{font:600 22px/1.2 var(--f-head);margin:0 0 6px;padding-top:6px;border-top:2px solid var(--ink)}
.prose{max-width:76ch}
.secgrid{display:grid;grid-template-columns:minmax(0,180px) minmax(0,1fr);gap:10px 20px;margin-top:12px}
.secgrid dt{font-family:var(--f-mono);font-size:13px;font-weight:500}
.secgrid dd{margin:0;color:var(--ink);max-width:76ch}
.pkg{margin:40px 0 0}
.pkg>h2{font:600 22px/1.2 var(--f-head);margin:0;padding-top:8px;border-top:2px solid var(--ink);font-family:var(--f-mono);font-size:19px}
.pkg>.about{max-width:78ch;margin:8px 0 14px}
details.mod{background:var(--panel);border:1px solid var(--line);border-radius:6px;margin:8px 0}
details.mod>summary{cursor:pointer;padding:10px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 14px;align-items:baseline}
details.mod>summary .path{font-family:var(--f-mono);font-size:13.5px;font-weight:500;overflow-wrap:anywhere}
details.mod>summary .stat{color:var(--muted);font-size:12px;white-space:nowrap;font-variant-numeric:tabular-nums}
details.mod>summary .a{grid-column:1/-1;color:var(--muted);font-size:13.5px}
details.mod[open]>summary{border-bottom:1px solid var(--line)}
.modbody{padding:4px 14px 12px}
.modbody .x{font-size:13.5px;color:var(--muted);max-width:80ch;margin:8px 0}
.consts{font-size:12.5px;color:var(--muted);margin:6px 0}
.fn{border-top:1px solid var(--line);padding:12px 0}
.fn:first-of-type{border-top:0}
.fn .sig{font-family:var(--f-mono);font-size:12.5px;background:var(--sig);padding:6px 9px;border-radius:4px;overflow-x:auto;white-space:pre-wrap;overflow-wrap:anywhere}
.fn .sig .nm{color:var(--accent);font-weight:500}
.fn .kind{font:600 10.5px/1 var(--f-head);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-right:6px}
.fn .desc{margin:7px 0 0;max-width:80ch}
.fn .body{margin:4px 0 0;color:var(--muted);font-size:13.5px;max-width:80ch}
.fn .inf{display:inline-block;font-size:11px;color:var(--flag);background:var(--flag-soft);border-radius:3px;padding:0 5px;margin-left:6px;vertical-align:1px}
.io{display:grid;grid-template-columns:72px minmax(0,1fr);gap:4px 10px;margin-top:8px;font-size:13.5px}
.io>.lab{font:600 10.5px/1.9 var(--f-head);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.io table{border-collapse:collapse;width:100%}
.io td{vertical-align:top;padding:2px 10px 2px 0;border-bottom:1px dotted var(--line)}
.io td.pn{font-family:var(--f-mono);font-size:12.5px;white-space:nowrap}
.io td.pt{font-family:var(--f-mono);font-size:12px;color:var(--muted);max-width:220px;overflow-wrap:anywhere}
.tbl{overflow-x:auto}
.kids{margin:10px 0 0 14px;padding-left:12px;border-left:2px solid var(--line)}
.kids .fn{padding:8px 0}
.nbblock{border-top:1px solid var(--line);padding:9px 0}
.nbblock:first-of-type{border-top:0}
.nbblock h4{margin:0;font:600 14px/1.35 var(--f-body)}
.nbblock .cc{color:var(--muted);font-weight:400;font-size:12px;margin-left:6px}
.nbblock p{margin:3px 0 0;font-size:13.5px;max-width:80ch;color:var(--ink)}
.nbblock .calls{font-size:12px;color:var(--muted);margin-top:3px;overflow-wrap:anywhere}
.badge{font:600 10.5px/1 var(--f-head);letter-spacing:.06em;text-transform:uppercase;padding:3px 6px;border-radius:3px;background:var(--accent-soft);color:var(--accent);margin-left:8px}
.fn,details.mod,.pkg,section.block{scroll-margin-top:130px}
.hit{outline:2px solid var(--accent);outline-offset:4px;border-radius:2px}
@media (max-width:860px){.wrap{grid-template-columns:minmax(0,1fr)} nav{position:static;max-height:none}
  .secgrid{grid-template-columns:minmax(0,1fr)} .io{grid-template-columns:minmax(0,1fr)}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>

<div class="wrap">
  <nav id="nav" aria-label="Contents"></nav>
  <main>
    <header class="top">
      <h1>magnitude-bandit-analysis: code map</h1>
      <p class="lede" id="lede"></p>
      <div class="meta" id="meta"></div>
    </header>
    <div class="search">
      <label for="q" hidden>Search</label>
      <input id="q" type="search" placeholder="Search functions, classes and descriptions, e.g. believed value, fit_restarts, rank" autocomplete="off">
      <div class="hint">Files open when you click them. Descriptions come from the code's docstrings; entries marked <span class="inf" style="margin:0">from code</span> had no docstring and were written from reading the function.</div>
    </div>
    <div id="results" aria-live="polite"></div>
    <section class="block" id="layout"><h2>How the repo is laid out</h2><dl class="secgrid" id="secgrid"></dl></section>
    <div id="pkgs"></div>
  </main>
</div>

<script type="application/json" id="data">__DATA__</script>
<script>
(function(){
const D = JSON.parse(document.getElementById("data").textContent);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const rich = s => esc(s).replace(/``([^`]+)``/g, "<code>$1</code>").replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/(^|[\s(])\*([^*\s][^*]*?)\*(?=[\s.,;:)]|$)/g, "$1<i>$2</i>");
const slug = p => "f-" + p.replace(/[^A-Za-z0-9]+/g, "-").replace(/^-|-$/g, "");
const kinds = {f:"function", c:"class", m:"method", n:"inner"};

// Header facts
let nMods = 0, nNb = 0, nFn = 0, nUndoc = 0;
const all = [];
function walk(list, mod, depth){ for (const e of list){ nFn++; if (e.u) nUndoc++; all.push({e, mod, depth}); if (e.c) walk(e.c, mod, depth+1); } }
for (const p of D.pkgs) for (const m of p.mods){ if (m.nb) nNb++; else { nMods++; walk(m.fn, m, 0); } }
document.getElementById("lede").innerHTML = D.intro;
document.getElementById("meta").innerHTML =
  `<span><b>${D.pkgs.length}</b> folders</span><span><b>${nMods}</b> Python files</span><span><b>${nNb}</b> notebooks</span>` +
  `<span><b>${nFn.toLocaleString()}</b> functions, classes and methods</span><span>Built from <span class="mono">${esc(D.meta)}</span></span>`;

document.getElementById("secgrid").innerHTML = D.sections.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${v}</dd>`).join("");

// Sidebar
const nav = document.getElementById("nav");
let navHtml = `<h2>Overview</h2><ul style="border:0;padding:0"><li><a href="#layout" style="font-family:var(--f-body);font-size:13.5px">How the repo is laid out</a></li></ul><h2>Folders</h2>`;
D.pkgs.forEach((p, i) => {
  navHtml += `<details><summary><a href="#${slug("pkg-" + p.name)}">${esc(p.name)}</a> <span class="count">${p.mods.length}</span></summary><ul>` +
    p.mods.map(m => `<li><a href="#${slug(m.p)}" data-open="${slug(m.p)}">${esc(m.p.split("/").pop())}</a></li>`).join("") + `</ul></details>`;
});
nav.innerHTML = navHtml;

// Main body: package sections with collapsed file cards
const root = document.getElementById("pkgs");
root.innerHTML = D.pkgs.map(p => {
  const files = p.mods.map(m => {
    const n = m.nb ? `${m.cells} cells` : `${m.L} lines · ${countDefs(m.fn)} defs`;
    return `<details class="mod" id="${slug(m.p)}"><summary><span class="path">${esc(m.p)}${m.nb ? '<span class="badge">notebook</span>' : ""}</span>` +
      `<span class="stat">${n}</span><span class="a">${m.a ? rich(m.a) : "No description."}</span></summary><div class="modbody"></div></details>`;
  }).join("");
  return `<section class="pkg" id="${slug("pkg-" + p.name)}"><h2>${esc(p.name)}</h2><p class="about">${p.about}</p>${files}</section>`;
}).join("");

function countDefs(list){ let n = 0; (function w(l){ for (const e of l){ n++; if (e.c) w(e.c); } })(list || []); return n; }
const modByPath = new Map(); for (const p of D.pkgs) for (const m of p.mods) modByPath.set(slug(m.p), m);

function fnHtml(e){
  const k = kinds[e.k] || "";
  const name = e.n.split(".").pop();
  const sig = esc(e.s).replace(esc(name), `<span class="nm">${esc(name)}</span>`);
  let h = `<div class="fn" id="${slugFn(e)}"><div class="sig"><span class="kind">${k}</span>${sig}</div>`;
  h += `<p class="desc">${e.d ? rich(e.d) : "<i>No description.</i>"}${e.u ? '<span class="inf">from code</span>' : ""}</p>`;
  if (e.b) h += `<p class="body">${rich(e.b)}</p>`;
  let io = "";
  if (e.i && e.i.length) io += `<div class="lab">Inputs</div><div class="tbl"><table>${e.i.map(([n, t, d]) =>
    `<tr><td class="pn">${esc(n)}</td><td class="pt">${esc(t)}</td><td>${d ? rich(d) : ""}</td></tr>`).join("")}</table></div>`;
  if (e.f && e.f.length) io += `<div class="lab">Fields</div><div class="mono" style="font-size:12.5px">${e.f.map(esc).join("<br>")}</div>`;
  if (e.o) io += `<div class="lab">Output</div><div>${rich(e.o)}</div>`;
  if (e.r) io += `<div class="lab">Raises</div><div>${rich(e.r)}</div>`;
  if (io) h += `<div class="io">${io}</div>`;
  if (e.c && e.c.length) h += `<div class="kids">${e.c.map(fnHtml).join("")}</div>`;
  return h + `</div>`;
}
let curMod = "";
function slugFn(e){ return slug(curMod + "--" + e.n); }

function nbHtml(m){
  return `<p class="x">${m.code} code cells of ${m.cells}. Blocks follow the notebook's own headings; "calls" lists the functions each block's code uses.</p>` +
    m.blocks.map(b => `<div class="nbblock" style="margin-left:${Math.max(0, b.v - 1) * 14}px"><h4>${rich(b.h)}<span class="cc">${b.c} code cell${b.c === 1 ? "" : "s"}</span></h4>` +
      (b.t ? `<p>${rich(b.t)}</p>` : "") + (b.f.length ? `<div class="calls">calls: <span class="mono">${b.f.map(esc).join(", ")}</span></div>` : "") + `</div>`).join("");
}
function render(det){
  const body = det.querySelector(".modbody");
  if (body.dataset.done) return;
  const m = modByPath.get(det.id); curMod = m.p;
  let h = "";
  if (m.nb) h = nbHtml(m);
  else {
    if (m.x) h += `<p class="x">${rich(m.x)}</p>`;
    if (m.K) h += `<div class="consts">Constants: <span class="mono">${m.K.map(esc).join(", ")}</span></div>`;
    h += m.fn.length ? m.fn.map(fnHtml).join("") : `<p class="x">No functions: the file runs top to bottom as a script, or only re-exports.</p>`;
  }
  body.innerHTML = h; body.dataset.done = "1";
}
root.addEventListener("toggle", ev => { if (ev.target.matches("details.mod") && ev.target.open) render(ev.target); }, true);

function openTo(fileId, fnId){
  const det = document.getElementById(fileId); if (!det) return;
  det.open = true; render(det);
  const target = (fnId && document.getElementById(fnId)) || det;
  target.scrollIntoView({block: "start"});
  if (fnId && target !== det){ target.classList.add("hit"); setTimeout(() => target.classList.remove("hit"), 1800); }
}
nav.addEventListener("click", ev => { const a = ev.target.closest("a[data-open]"); if (a){ ev.preventDefault(); openTo(a.dataset.open); history.replaceState(null, "", "#" + a.dataset.open); } });
function fromHash(){ const h = location.hash.slice(1); if (h && modByPath.has(h)) openTo(h); }
window.addEventListener("hashchange", fromHash); fromHash();

// Search
const q = document.getElementById("q"), res = document.getElementById("results");
const index = all.map(({e, mod}) => ({e, mod, hay: (e.n + " " + (e.d || "") + " " + mod.p).toLowerCase()}));
for (const p of D.pkgs) for (const m of p.mods) if (m.nb) for (const b of m.blocks) index.push({nb: b, mod: m, hay: (b.h + " " + b.t + " " + m.p).toLowerCase()});
let timer;
q.addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(search, 120); });
function search(){
  const terms = q.value.toLowerCase().trim().split(/\s+/).filter(Boolean);
  if (!terms.length){ res.className = ""; res.innerHTML = ""; return; }
  const hits = [];
  for (const it of index){ if (terms.every(t => it.hay.includes(t))){
    const nm = it.e ? it.e.n.toLowerCase() : it.nb.h.toLowerCase();
    const score = terms.reduce((s, t) => s + (nm === t ? 5 : nm.includes(t) ? 2 : 0), 0) + (it.e && it.e.k !== "n" ? 1 : 0);
    hits.push([score, it]); } }
  hits.sort((a, b) => b[0] - a[0]);
  const shown = hits.slice(0, 60);
  res.className = "on";
  res.innerHTML = (shown.length ? shown.map(([, it]) => {
    const fid = slug(it.mod.p);
    if (it.nb) return `<div class="r"><a href="#${fid}" data-f="${fid}"><span class="q">${esc(it.nb.h)}</span></a> <span class="w">${esc(it.mod.p)} · notebook block</span><div class="t">${rich(it.nb.t.slice(0, 180))}</div></div>`;
    curMod = it.mod.p; const fn = slugFn(it.e);
    return `<div class="r"><a href="#${fid}" data-f="${fid}" data-fn="${fn}"><span class="q">${esc(it.e.n)}</span></a> <span class="w">${esc(it.mod.p)}</span><div class="t">${rich(it.e.d || "")}</div></div>`;
  }).join("") : `<div class="more">No matches.</div>`) + (hits.length > 60 ? `<div class="more">${hits.length - 60} more; add a word to narrow it.</div>` : "");
}
res.addEventListener("click", ev => { const a = ev.target.closest("a[data-f]"); if (!a) return; ev.preventDefault(); openTo(a.dataset.f, a.dataset.fn); history.replaceState(null, "", "#" + a.dataset.f); });
})();
</script>
